name: Backend tests

on:
  push:
    branches: [ai]
  pull_request:
    branches: [ai]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (.NET 10)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore SchoolLibrary.slnx

      - name: Build solution
        run: dotnet build SchoolLibrary.slnx --configuration Release --no-restore

      - name: Run all tests
        run: >-
          dotnet test SchoolLibrary.slnx
          --configuration Release --no-build --no-restore
          --logger trx --results-directory artifacts/test-results

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: artifacts/test-results/**/*.trx
          if-no-files-found: warn
          retention-days: 14
